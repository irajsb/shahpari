# Sends one daily push at 11:00 Iran time. The app has no backend: its "کپی تنظیمات اعلان"
# button produces {tz, sub, schedule} which goes into the SHAHPARI_PUSH repo secret (only .sub is used).
name: notify
on:
  schedule:
    - cron: '30 7 * * *'      # 11:00 Iran time (UTC+3:30, no DST since 2022)
    - cron: '0 0 1 * *'       # keepalive
  workflow_dispatch:          # manual run = test notification

jobs:
  push:
    if: github.event.schedule != '0 0 1 * *'
    runs-on: ubuntu-latest
    env:
      CFG: ${{ secrets.SHAHPARI_PUSH }}
      VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_PUBLIC: BKfIaLd5y-KtyffIbjNZhhHyGEyyAaNveNG9OvCT_TA497aAGTFJa0WWyHqG_gIf9-1lGnJ5d1OmN97pqfgVYbs
    steps:
      - run: |
          [ -n "$CFG" ] || { echo "SHAHPARI_PUSH secret not set"; exit 0; }
          CFG=$(sed -e 's/“/"/g' -e 's/”/"/g' -e 's/„/"/g' <<<"$CFG") # iOS Smart Punctuation curls quotes when the text passes through Notes/Messages
          jq -e '.sub.endpoint and .schedule' <<<"$CFG" >/dev/null 2>&1 || {
            echo "::error::SHAHPARI_PUSH is not the app's config. It must be the exact text from ⚙️ → کپی تنظیمات اعلان, starting with {\"tz\":"
            exit 1; }
          body='سلام 🌸 یه نگاه به برنامهٔ امروزت بنداز'
          [ "${{ github.event_name }}" = workflow_dispatch ] && body='اعلان آزمایشی 🌸'
          npx -y web-push send-notification \
            --endpoint="$(jq -r .sub.endpoint <<<"$CFG")" \
            --key="$(jq -r .sub.keys.p256dh <<<"$CFG")" \
            --auth="$(jq -r .sub.keys.auth <<<"$CFG")" \
            --payload="$(jq -nc --arg b "$body" '{title: "شاه‌پری", body: $b}')" \
            --vapid-subject="${{ github.server_url }}/${{ github.repository }}" \
            --vapid-pubkey="$VAPID_PUBLIC" --vapid-pvtkey="$VAPID_PRIVATE"

  # GitHub pauses scheduled workflows after 60 days without repo activity; re-enabling resets that.
  keepalive:
    if: github.event.schedule == '0 0 1 * *'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh api -X PUT repos/${{ github.repository }}/actions/workflows/notify.yml/enable
        env:
          GH_TOKEN: ${{ github.token }}
